[build-system]
requires = ["setuptools>=81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nxp-mcp-freemaster"
version = "2.0.0"
description = "FreeMASTER AI Support: meta-package for the NXP FreeMASTER MCP server"
requires-python = ">=3.11"
dependencies = [
  "nxp-mcp-shared==2.0.0",
  "nxp-mcp-freemaster==2.0.0"
]

# ---------------------------------------------------------------------------
# The FreeMASTER server owns its own pyproject.toml under
# packages/mcp_freemaster/ and declares the "nxp.mcp.servers" entry-point
# there, so it can be installed independently. This root pyproject.toml is
# a convenience dev-aggregate only.
#
# nxp-mcp-shared is not built here: it comes from the mcp-core release
# (https://github.com/nxp-agentic-ai/mcp-core, tag v2.0.0), see requirements.txt.
# ---------------------------------------------------------------------------

[tool.setuptools]
packages = []
